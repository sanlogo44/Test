name: Starter CI

on:
  push:
    branches:
      - main
      - work/persistent-job-worker
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm-platform-starter-streaming
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Commit formatting changes
        working-directory: .
        shell: bash
        run: |
          if ! git diff --quiet -- llm-platform-starter-streaming; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add llm-platform-starter-streaming
            git commit -m "Apply rustfmt to starter sources"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Verify formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run Rust tests
        run: cargo test
      - name: Run SQLite schema tests
        run: python3 tests/schema_test.py
      - name: Package updated starter
        run: zip -qr ../llm-platform-starter-updated.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: llm-platform-starter-updated
          path: llm-platform-starter-updated.zip
          if-no-files-found: error
